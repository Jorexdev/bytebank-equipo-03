server:
  port: 8085

spring:
  application:
    name: ms-fraud
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fraud_db}
    username: ${DB_USER:bytebank}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

bytebank:
  jwt:
    secret: ${JWT_SECRET}
  internal-key: ${INTERNAL_KEY}
  fraud:
    block-threshold: 20000.00
    external-review-threshold: 1000.00
    frequency-limit: 5
    frequency-window: 10m

management:
  endpoints:
    web:
      exposure:
        include: health
