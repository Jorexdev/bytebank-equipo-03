x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
  DB_USER: ${POSTGRES_USER:-bytebank}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
  JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
  INTERNAL_KEY: ${INTERNAL_KEY:?Falta INTERNAL_KEY en .env}
  AUTH_URL: http://ms-auth:8081
  ACCOUNTS_URL: http://ms-accounts:8082
  TRANSFERS_URL: http://ms-transfers:8083
  CARDS_URL: http://ms-cards:8084
  FRAUD_URL: http://ms-fraud:8085
  NOTIFICATIONS_URL: http://ms-notifications:8086
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bytebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bytebank}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka en modo KRaft (sin ZooKeeper), un solo nodo que hace de broker y de controlador.
  # Desde los contenedores: kafka:9092. Desde tu máquina (servicios lanzados desde el IDE): localhost:29092.
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  ms-gateway:
    build: { context: ., args: { MODULE: ms-gateway } }
    restart: unless-stopped
    environment: *common-env
    ports:
      - "8080:8080"

  ms-auth:
    <<: *service
    build: { context: ., args: { MODULE: ms-auth } }
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/auth_db

  ms-accounts:
    <<: *service
    build: { context: ., args: { MODULE: ms-accounts } }
    ports:
      - "8082:8082"
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/accounts_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ms-transfers:
    <<: *service
    build: { context: ., args: { MODULE: ms-transfers } }
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/transfers_db

  ms-cards:
    <<: *service
    build: { context: ., args: { MODULE: ms-cards } }
    ports:
      - "8084:8084"
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/cards_db

  ms-fraud:
    <<: *service
    build: { context: ., args: { MODULE: ms-fraud } }
    ports:
      - "8085:8085"
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/fraud_db

  ms-notifications:
    <<: *service
    build: { context: ., args: { MODULE: ms-notifications } }
    ports:
      - "8086:8086"
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/notifications_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  pgdata:
