name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configurar la versión de la API de Docker para Testcontainers
        run: echo "api.version=1.44" > "$HOME/.docker-java.properties"

      - name: Compilar y ejecutar tests
        run: mvn -B --no-transfer-progress verify

      - name: Subir informes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-tests
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
