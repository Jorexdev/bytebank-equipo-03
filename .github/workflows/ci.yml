name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configurar la versión de la API de Docker para Testcontainers
        run: echo "api.version=1.44" > "$HOME/.docker-java.properties"

      - name: Compilar y ejecutar tests
        run: mvn -B --no-transfer-progress verify

      - name: Subir informes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-tests
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imágenes Docker de los 7 microservicios
        run: |
          for module in \
            ms-gateway \
            ms-auth \
            ms-accounts \
            ms-transfers \
            ms-cards \
            ms-fraud \
            ms-notifications
          do
            echo "=== Construyendo imagen Docker para ${module} ==="
            docker buildx build \
              --load \
              --build-arg MODULE="${module}" \
              --tag "bytebank/${module}:ci" \
              .
          done
