server:
  port: 8081

spring:
  application:
    name: ms-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USER:bytebank}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

bytebank:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  internal-key: ${INTERNAL_KEY}
  security:
    public-paths:
      - /api/auth/register
      - /api/auth/login

management:
  endpoints:
    web:
      exposure:
        include: health
