server:
  port: 8082

spring:
  application:
    name: ms-accounts
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accounts_db}
    username: ${DB_USER:bytebank}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

bytebank:
  zone: Europe/Madrid
  jwt:
    secret: ${JWT_SECRET}
  internal-key: ${INTERNAL_KEY}
  services:
    auth-url: ${AUTH_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
